# Yerel gelistirme icin. Home Assistant kurulumu budget_addon/config.yaml
# uzerinden yapilir; bu dosya yalnizca gelistirme ortamini ayaga kaldirir.
services:
  budget:
    build:
      context: ./budget_addon
      args:
        BUILD_FROM: python:3.12-alpine
    env_file:
      - budget_addon/.env
    environment:
      DATABASE_PATH: /data/budget.db
      FRONTEND_DIST: /app/frontend
      TRUST_INGRESS_HEADERS: "false"
      RUN_BACKGROUND_JOBS: "true"
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8100"
    ports:
      - "8100:8100"
    volumes:
      - budget-data:/data

volumes:
  budget-data:
