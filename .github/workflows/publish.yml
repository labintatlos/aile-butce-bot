# main'e gelen her eklenti degisikliginde imaji iki mimari icin derler ve
# ghcr.io'ya gonderir. Home Assistant eklentiyi cihazda derlemez, config.yaml'daki
# `image` adresinden hazir imaji indirir. Cihazda derleme, derleme sirasinda
# npm ve PyPI'ya ulasmayi gerektiriyordu; cihazin DNS'i takildiginda guncelleme
# yarida kaliyordu.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - budget_addon/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Surumu config.yaml'dan oku
        id: meta
        run: |
          version=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' budget_addon/config.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-family_budget" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Eklenti imajini derle ve gonder (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: budget_addon
          platforms: ${{ matrix.arch == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-python:3.12-alpine3.20
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=app
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # Tek platformluk duz bir manifest gonderilir; Supervisor ek
          # attestation katmanlariyla ugrasmaz.
          provenance: false
          push: true
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.arch }}
