# Yalnizca gelistirme araclarinin ayarlari. Uygulama paket olarak kurulmaz.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = [
  "E501",  # uzun satirlar: aciklama metinleri ve SQL ifadeleri bilerek bolunmez
  "B008",  # FastAPI `Depends(...)` varsayilan argumanda cagrilir
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
