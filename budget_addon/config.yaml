name: Aile Bütçe Takip
description: Telegram üzerinden aile bütçesi ve kredi kartı taksit takibi
version: "1.4.0"
slug: family_budget
url: https://github.com/labintatlos/aile-butce-bot
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# Arayuz HA'nin kendi oturumu ve HTTPS'i uzerinden sunulur; tunel, alan adi
# veya sertifika gerekmez.
ingress: true
ingress_port: 8099
panel_icon: mdi:wallet
panel_title: Bütçe

# Ingress portu disariya acilmaz: X-Remote-User-Id basligina yalnizca
# Supervisor agindan gelen istekte guvenilir. Telegram Mini App icin kullanilan
# 8100 ise basliga guvenmeyen ayri bir surectir.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Telegram Mini App için genel erişim (yalnızca imzalı initData kabul eder)

# HA'nin config, ssl, share veya media klasorlerine erisim istenmez.
map: []

# Butce degerlerini Home Assistant sensorlerine yazabilmek icin gereklidir.
# Yalnizca durum yazmak icin kullanilir; baska hicbir HA verisi okunmaz.
homeassistant_api: true

options:
  telegram_bot_token: ""
  authorized_telegram_ids: ""
  user_display_names: ""
  ha_user_map: ""
  webapp_public_url: ""
  timezone: Europe/Istanbul
  log_level: info
  backup_retention: 14
  enable_reminders: true
  reminder_hour: 9
  due_reminder_days: 3
  publish_ha_sensors: true
  ha_publish_interval_minutes: 15

schema:
  telegram_bot_token: password
  authorized_telegram_ids: str
  user_display_names: str
  ha_user_map: str?
  webapp_public_url: str?
  timezone: str
  log_level: list(debug|info|warning|error)
  backup_retention: int(1,365)
  enable_reminders: bool
  reminder_hour: int(0,23)
  due_reminder_days: int(0,28)
  publish_ha_sensors: bool
  ha_publish_interval_minutes: int(1,1440)
